<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Love — QR Creator</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#fff7f0;color:#3a1021;font-family:'DM Sans',sans-serif}.card{width:min(560px,100%);padding:42px 28px;text-align:center;background:white;border:1px solid #e7d0d1;box-shadow:0 20px 65px #3a102115}.eyebrow{font-size:9px;letter-spacing:.23em;color:#b9788d;font-weight:bold}h1{font:500 42px 'Playfair Display';margin:14px 0}p{font-size:13px;line-height:1.8;color:#8a727a}input{width:100%;padding:15px;border:1px solid #e3cbd0;margin:14px 0;font:13px 'DM Sans'}button{padding:14px 20px;background:#3a1021;color:#fff;border:0;cursor:pointer;margin:5px}#qrcode{display:flex;justify-content:center;margin:24px auto}#qrcode img{max-width:100%}.back{display:block;margin-top:20px;color:#7b2947;font-size:12px}</style></head><body><main class="card"><div class="eyebrow">A SECRET LITTLE GIFT</div><h1>For my love ♡</h1><p>Paste the public URL of your published birthday website. Your QR code will be generated below.</p><input id="url" type="url" placeholder="https://your-site.netlify.app"><button id="create">Create QR code</button><div id="qrcode"></div><p id="status">Test the QR code with another phone before sharing it.</p><button id="download" hidden>Download QR image</button><a class="back" href="index.html">← Return to the birthday surprise</a></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
document.getElementById('create').onclick=()=>{let u=document.getElementById('url').value.trim();if(!/^https?:\\/\\//i.test(u)){document.getElementById('status').textContent='Enter a full public URL beginning with https://';return;}if(!window.QRCode){document.getElementById('status').textContent='QR library needs an internet connection.';return;}let q=document.getElementById('qrcode');q.innerHTML='';new QRCode(q,{text:u,width:250,height:250,colorDark:'#3a1021',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});document.getElementById('status').textContent='Your QR code is ready. Scan it to test the link.';document.getElementById('download').hidden=false;};
document.getElementById('download').onclick=()=>{let el=document.querySelector('#qrcode canvas')||document.querySelector('#qrcode img');if(!el)return;let a=document.createElement('a');a.download='My-Love-Birthday-QR.png';a.href=el.tagName==='CANVAS'?el.toDataURL('image/png'):el.src;a.click();};
</script></body></html>
